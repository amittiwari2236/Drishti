databases:
  - name: drishti-db
    databaseName: drishti
    user: drishti_user
    plan: free

services:
  - type: web
    name: drishti-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
