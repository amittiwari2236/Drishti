databases:
  - name: drishti-db
    databaseName: drishti
    user: drishti_user
    plan: free

services:
  - type: web
    name: drishti-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Replace with your final Render onrender.com URL
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
