services:
  - type: web
    name: drishti-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Replace with your final Render onrender.com URL
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: drishti-db
    plan: free
    region: oregon
    databaseName: drishti
    user: drishti_user
